version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/songr.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: songr

build:
  toolchains: []
  run_buildscript: false

images:
  - id: songr
    target: service
    service: songr
    source: ghcr.io/roethlar/songr
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
  private:
    enabled: true
    skip_if_version_exists: true
    name: Songr
    summary: Published from GitHub Actions
